services:
  api:
    build: .
    container_name: nlp_sentiment_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models   # mount trained models at runtime
    environment:
      - DATASET=amazon         # switch to "sentiment140" for twitter model
      - MODELS_DIR=models
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    restart: unless-stopped

  streamlit:
    build: .
    container_name: nlp_streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./conf:/app/conf
    environment:
      - DATASET=amazon
    command: ["uv", "run", "streamlit", "run", "src/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    restart: unless-stopped

