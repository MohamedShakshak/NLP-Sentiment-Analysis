services:
  api:
    build: .
    container_name: nlp_sentiment_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models   # mount trained models at runtime
    environment:
      - DATASET=amazon         # switch to "sentiment140" for twitter model
      - MODELS_DIR=models
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    restart: unless-stopped
