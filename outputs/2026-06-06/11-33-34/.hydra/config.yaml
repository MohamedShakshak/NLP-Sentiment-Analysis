dataset:
  name: sentiment140
  raw_path: data/raw/training.1600000.processed.noemoticon.csv
  read_csv_kwargs:
    encoding: latin-1
    header: null
  column_mapping:
    5: raw_text
    0: target
  drop_classes: []
  target_mapping:
    0: 0
    4: 1
preprocess:
  lowercase: true
  remove_stopwords: false
  method: lemmatization
  handle_social_tokens: true
  expand_contractions: true
  strip_html: false
  collapse_elongated: true
vectorizer:
  method: tfidf
  max_features: 15000
model:
  class_name: sklearn.linear_model.LogisticRegression
  params:
    C: 1.0
    max_iter: 1000
    random_state: 42
split:
  test_size: 0.2
  random_state: 42
  stratify: true
seed: 42
